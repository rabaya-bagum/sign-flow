name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: App (typecheck, lint, unit tests)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test -- --ci
      - run: npm run check:surface
      - run: npm run check:dev-routes

  backend:
    name: Backend (pgTAP, Edge Function tests)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Local stack in Docker (Postgres, Auth, Storage, Mailpit). Studio and analytics aren't needed.
      - run: npx supabase start -x studio,vector,logflare
      - run: npm run db:test
      - run: npm run test:functions
      - if: always()
        run: npx supabase stop --no-backup
