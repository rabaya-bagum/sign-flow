<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <!-- Offline, single file: no network except the PDF itself (connect-src). -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'unsafe-inline' blob:; worker-src blob:; connect-src https: http:; img-src data: blob:; style-src 'unsafe-inline'; font-src data:"
    />
    <title>SignFlow PDF surface</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #f7f8fa; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
      #viewer { position: absolute; inset: 0; overflow: auto; -webkit-overflow-scrolling: touch; touch-action: pan-x pan-y; }
      #pages { padding: 12px; display: flex; flex-direction: column; align-items: center; gap: 12px; width: max-content; min-width: 100%; box-sizing: border-box; }
      body.preview #viewer { overflow: hidden; pointer-events: none; }
      .page { position: relative; background: #fff; box-shadow: 0 1px 3px rgba(16, 24, 40, 0.15); flex: none; }
      .page canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
      .overlays { position: absolute; inset: 0; pointer-events: none; }
      .overlay { position: absolute; box-sizing: border-box; border: 2px solid #2b59d9; border-radius: 4px; }
      img.overlay { border: none; object-fit: contain; }
      .overlay.highlighted { box-shadow: 0 0 0 3px rgba(255, 196, 0, 0.9); }
      .overlay.editable { pointer-events: auto; touch-action: none; cursor: move; }
      .overlay .text { position: absolute; inset: 0 4px; display: flex; align-items: center; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; font: 600 11px/1.1 -apple-system, system-ui, sans-serif; color: #1f2328; pointer-events: none; }
      .handle { position: absolute; width: 22px; height: 22px; margin: -11px; touch-action: none; }
      .handle::after { content: ''; position: absolute; inset: 6px; border-radius: 50%; background: #fff; border: 2px solid currentColor; }
      .handle.nw { left: 0; top: 0; cursor: nwse-resize; } .handle.ne { right: 0; top: 0; margin-right: -11px; cursor: nesw-resize; }
      .handle.sw { left: 0; bottom: 0; margin-bottom: -11px; cursor: nesw-resize; } .handle.se { right: 0; bottom: 0; margin: 0 -11px -11px 0; cursor: nwse-resize; }
    </style>
  </head>
  <body>
    <div id="viewer"><div id="pages"></div></div>
    <script>/*__SURFACE_SCRIPT__*/</script>
  </body>
</html>
